<!DOCTYPE html>
<html>
<head>
    <title>Book Form - Stellar Spring LMS</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="navbar">
    <b>Stellar Spring LMS</b>
    <a href="/">Home</a>
    <a href="/books">Books</a>
    <a href="/checkouts">Checkouts</a>
    <a href="/ratings">Ratings</a>
    <a href="/users">Users</a>
    <a href="/logout">Logout</a>
</div>

<div class="container">

    <div class="page-title">
        {% if book %}
            <h1>Edit Book</h1>
            <p>Update book information.</p>
        {% else %}
            <h1>Add New Book</h1>
            <p>Admin can add a new book to the catalog.</p>
        {% endif %}
    </div>

    <div class="card form-card">
        <a class="simple-link" href="/books">Back to Books</a>

        <form method="POST" class="book-form">
            <label>Title:</label>
            <input type="text" name="title" value="{{ book.title if book else '' }}" required>

            <label>Author:</label>
            <input type="text" name="author" value="{{ book.author if book else '' }}" required>

            <label>Genre:</label>
            <select name="genre_id">
                <option value="">No genre</option>
                {% for genre in genres %}
                    <option value="{{ genre.id }}"
                        {% if book and book.genre_id == genre.id %}selected{% endif %}>
                        {{ genre.name }}
                    </option>
                {% endfor %}
            </select>

            <label>Translator:</label>
            <input type="text" name="translator" value="{{ book.translator if book and book.translator else '' }}">

            <label>Total Copies:</label>
            <input type="number" name="total_copies" min="1" value="{{ book.total_copies if book else 1 }}" required>

            <label>Description:</label>
            <textarea name="description" rows="4">{{ book.description if book and book.description else '' }}</textarea>

            <button type="submit">
                {% if book %}Save Changes{% else %}Add Book{% endif %}
            </button>
        </form>
    </div>

</div>

</body>
</html>
