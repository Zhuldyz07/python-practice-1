{% extends "base.html" %}
{% block title %}{{ 'Edit' if member else 'Add' }} Member — LMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="d-flex align-items-center gap-3 mb-4">
      <a href="/members" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Back
      </a>
      <h2 class="fw-bold mb-0">{{ 'Edit Member' if member else 'Add New Member' }}</h2>
    </div>

    <div class="card lms-card">
      <div class="card-body p-4">
        <form method="POST">
          <div class="row g-3">

            <div class="col-12">
              <label class="form-label fw-medium">Full Name <span class="text-danger">*</span></label>
              <input type="text" name="full_name" class="form-control" required
                     value="{{ member.full_name if member else '' }}"
                     placeholder="e.g. Aibek Seitkali">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-medium">Email <span class="text-danger">*</span></label>
              <input type="email" name="email" class="form-control" required
                     value="{{ member.email if member else '' }}"
                     placeholder="email@example.com">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-medium">Phone</label>
              <input type="text" name="phone" class="form-control"
                     value="{{ member.phone if member else '' }}"
                     placeholder="+7 700 000 0000">
            </div>

            {% if member %}
            <div class="col-12">
              <label class="form-label fw-medium">Status</label>
              <select name="status" class="form-select">
                <option value="active"  {% if member.status == 'active'  %}selected{% endif %}>Active</option>
                <option value="blocked" {% if member.status == 'blocked' %}selected{% endif %}>Blocked</option>
              </select>
            </div>
            {% endif %}

            <div class="col-12 d-flex gap-2 pt-2">
              <button type="submit" class="btn btn-primary px-4">
                <i class="bi bi-check-circle me-1"></i>
                {{ 'Save Changes' if member else 'Add Member' }}
              </button>
              <a href="{{ '/members/' + member.id|string if member else '/members' }}"
                 class="btn btn-outline-secondary">Cancel</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
