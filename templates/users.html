<!DOCTYPE html>
<html>
<head>
    <title>Users - Stellar Spring LMS</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="navbar">
    <b>Stellar Spring LMS</b>
    <a href="/">Home</a>
    <a href="/books">Books</a>
    <a href="/checkouts">Checkouts</a>
    <a href="/ratings">Ratings</a>
    <a href="/users">Users</a>
    <a href="/logout">Logout</a>
</div>

<div class="container">

    <div class="page-title">
        <h1>Users</h1>
        <p>Admin can view all registered users.</p>
    </div>

    <div class="card table-card">
        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Created At</th>
            </tr>

            {% for u in users %}
            <tr>
                <td>{{ u.id }}</td>
                <td><b>{{ u.name }}</b></td>
                <td>{{ u.email }}</td>
                <td>{{ u.role }}</td>
                <td>{{ u.created_at }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>

</div>

</body>
</html>
