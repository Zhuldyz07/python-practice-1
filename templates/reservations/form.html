{% extends "base.html" %}
{% block title %}New Reservation — LMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="d-flex align-items-center gap-3 mb-4">
      <a href="/reservations" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Back
      </a>
      <h2 class="fw-bold mb-0">New Reservation</h2>
    </div>

    <div class="card lms-card">
      <div class="card-body p-4">
        <form method="POST">
          <div class="row g-3">

            <div class="col-12">
              <label class="form-label fw-medium">Select Book <span class="text-danger">*</span></label>
              <select name="book_id" class="form-select" required>
                <option value="">— Choose a book —</option>
                {% for book in books %}
                  <option value="{{ book.id }}"
                    {% if pre_book == book.id|string %}selected{% endif %}>
                    {{ book.title }} — by {{ book.author }}
                    {% if book.available_copies > 0 %}(Available){% else %}(Not available){% endif %}
                  </option>
                {% endfor %}
              </select>
            </div>

            <div class="col-12">
              <label class="form-label fw-medium">Select Member <span class="text-danger">*</span></label>
              <select name="member_id" class="form-select" required>
                <option value="">— Choose a member —</option>
                {% for m in members %}
                  <option value="{{ m.id }}"
                    {% if pre_member == m.id|string %}selected{% endif %}>
                    {{ m.full_name }} — {{ m.email }}
                  </option>
                {% endfor %}
              </select>
            </div>

            <div class="col-12 d-flex gap-2 pt-2">
              <button type="submit" class="btn btn-primary px-4">
                <i class="bi bi-bookmark-plus me-1"></i> Create Reservation
              </button>
              <a href="/reservations" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
