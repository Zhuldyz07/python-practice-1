{% extends "base.html" %}
{% block title %}{{ 'Edit' if book else 'Add' }} Book — LMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="d-flex align-items-center gap-3 mb-4">
      <a href="/books" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Back
      </a>
      <h2 class="fw-bold mb-0">{{ 'Edit Book' if book else 'Add New Book' }}</h2>
    </div>

    <div class="card lms-card">
      <div class="card-body p-4">
        <form method="POST">
          <div class="row g-3">

            <div class="col-12">
              <label class="form-label fw-medium">Title <span class="text-danger">*</span></label>
              <input type="text" name="title" class="form-control" required
                     value="{{ book.title if book else '' }}" placeholder="Book title">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-medium">Author <span class="text-danger">*</span></label>
              <input type="text" name="author" class="form-control" required
                     value="{{ book.author if book else '' }}" placeholder="Author name">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-medium">ISBN</label>
              <input type="text" name="isbn" class="form-control"
                     value="{{ book.isbn if book else '' }}" placeholder="978-x-xxx-xxxxx-x">
            </div>

            <div class="col-md-6">
              <label class="form-label fw-medium">Category</label>
              <select name="category_id" class="form-select">
                <option value="">— Select category —</option>
                {% for cat in categories %}
                  <option value="{{ cat.id }}"
                    {% if book and book.category_id == cat.id %}selected{% endif %}>
                    {{ cat.name }}
                  </option>
                {% endfor %}
              </select>
            </div>

            <div class="col-md-3">
              <label class="form-label fw-medium">Total Copies <span class="text-danger">*</span></label>
              <input type="number" name="total_copies" class="form-control" min="1" required
                     value="{{ book.total_copies if book else 1 }}">
            </div>

            <div class="col-md-3">
              <label class="form-label fw-medium">Published Year</label>
              <input type="number" name="published_year" class="form-control"
                     min="1000" max="2025"
                     value="{{ book.published_year if book else '' }}" placeholder="2024">
            </div>

            <div class="col-12">
              <label class="form-label fw-medium">Description</label>
              <textarea name="description" class="form-control" rows="3"
                        placeholder="Brief description of the book…">{{ book.description if book else '' }}</textarea>
            </div>

            <div class="col-12 d-flex gap-2 pt-2">
              <button type="submit" class="btn btn-primary px-4">
                <i class="bi bi-check-circle me-1"></i>
                {{ 'Save Changes' if book else 'Add Book' }}
              </button>
              <a href="/books" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
